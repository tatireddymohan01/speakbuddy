<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <title>SpeakBuddy — Spoken English Practice</title>
  <meta name="description" content="Practise speaking English with an always-listening AI tutor." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣️</text></svg>" />
</head>
<body>

<div class="app">

  <!-- ── Header ───────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🗣️</span>
      <span class="brand-name">SpeakBuddy</span>
    </div>

    <div class="mode-toggle" role="radiogroup" aria-label="Practice mode">
      <button class="mode-btn" data-mode="casual" role="radio" aria-checked="false" type="button">
        <span class="mode-full">Casual Chat</span><span class="mode-short">Casual</span>
      </button>
      <button class="mode-btn" data-mode="lesson" role="radio" aria-checked="false" type="button">
        <span class="mode-full">Lesson Mode</span><span class="mode-short">Lesson</span>
      </button>
      <button class="mode-btn is-active" data-mode="correction" role="radio" aria-checked="true" type="button">
        <span class="mode-full">Speech Correction</span><span class="mode-short">Correct</span>
      </button>
    </div>

    <button id="btnMic" class="mic-btn" type="button" aria-pressed="false" title="Turn microphone on or off">
      <svg class="ico ico-on" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 11Z"/>
      </svg>
      <svg class="ico ico-off" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.3 2.3a1 1 0 0 0-1.4 1.4l18 18a1 1 0 0 0 1.4-1.4l-18-18Z"/>
        <path d="M15 11.2V6a3 3 0 0 0-5.9-.7L15 11.2ZM9 9.9V12a3 3 0 0 0 4.2 2.7L9 9.9Z"/>
        <path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-.3 1.5l1.5 1.5A6 6 0 0 0 18 11Zm-4.3 5.8A6 6 0 0 1 6 11a1 1 0 1 1 2 0 4 4 0 0 0 6.1 3.4l1.4 1.5c-.5.4-1.1.7-1.8.9V19H15a1 1 0 1 1 0 2H9a1 1 0 1 1 0-2h2v-2.1l.7-.1Z"/>
      </svg>
      <span class="mic-label">Start</span>
    </button>
  </header>

  <!-- ── Status ───────────────────────────────────────────────── -->
  <div class="statusbar">
    <div id="statusPill" class="status-pill is-idle" role="status" aria-live="polite">
      <span class="status-viz" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="statusText" class="status-text">Tap Start to begin</span>
    </div>

    <label class="accent-picker" title="Which English accent to listen for">
      <span class="sr-only">Recognition accent — how you speak</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M18 11a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V19H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.09A6 6 0 0 0 18 11Z"/></svg>
      <select id="accentSelect" class="accent-select"></select>
    </label>

    <label class="accent-picker" id="voicePicker" title="How the tutor's voice sounds" hidden>
      <span class="sr-only">Tutor voice accent</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9v6h4l5 5V4L9 9H5Zm11.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Zm-2.5-8.7v2.1a7 7 0 0 1 0 13.2v2.1a9 9 0 0 0 0-17.4Z"/></svg>
      <select id="voiceSelect" class="accent-select"></select>
    </label>
  </div>

  <!-- ── Error banner ─────────────────────────────────────────── -->
  <div id="errorBanner" class="error-banner" role="alert" hidden>
    <p id="errorText" class="error-text"></p>
    <div class="error-actions">
      <button id="errorRetry" class="btn btn-sm btn-primary" type="button" hidden>Retry</button>
      <button id="errorClose" class="btn btn-sm btn-ghost" type="button">Dismiss</button>
    </div>
  </div>

  <!-- ── Transcript ───────────────────────────────────────────── -->
  <main id="chat" class="chat" aria-label="Conversation transcript" tabindex="0"></main>

  <!-- ── Composer ─────────────────────────────────────────────── -->
  <footer class="composer">
    <p id="interim" class="interim" aria-hidden="true"></p>

    <form id="textForm" class="text-form" autocomplete="off">
      <input id="textInput" class="text-input" type="text"
             placeholder="Or type your turn here…" aria-label="Type your turn" />
      <button id="btnSend" class="btn btn-primary btn-send" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3.4 20.4 17.5-7.5a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.39.94L2 9.36a1 1 0 0 0 .8.98l10.7 1.66-10.7 1.66a1 1 0 0 0-.8.98l.01 4.82a1 1 0 0 0 1.39.94Z"/></svg>
      </button>
      <button id="btnNew" class="btn btn-ghost btn-new" type="button" title="Start a new conversation">New</button>
    </form>

    <p class="hint">Speak naturally — your turn sends automatically after a short pause.</p>
  </footer>

</div>

<script src="/app.js"></script>
</body>
</html>
